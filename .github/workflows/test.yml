name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: dist/ is up to date with the source
        run: |
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is stale — run 'npm run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
